[workspace]
resolver = "2"
members = ["common", "enc", "dec"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/igorauad/gr-dvbs2rx"

[workspace.dependencies]
raptorq = "2.0"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zmq = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
